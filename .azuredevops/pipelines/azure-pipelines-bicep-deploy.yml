# Azure DevOps Bicep deploy: provision, post-deploy, then unconditional cleanup.

trigger:
  branches:
    include:
      - main

pr: none

schedules:
  # 00:00 IST daily (18:30 UTC the previous day).
  - cron: "30 18 * * *"
    displayName: Daily validation (00:00 IST)
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: bicep-deploy
  - name: SERVICE_CONNECTION
    value: azure-service-connection
  - name: INFRA_DIR
    value: infra
  - name: AZURE_ENV_NAME
    value: $(ENV_PREFIX)$(Build.BuildId)
  - name: AZURE_RESOURCE_GROUP
    value: rg-$(AZURE_ENV_NAME)

stages:
  - stage: Provision
    displayName: Provision infrastructure
    jobs:
      - job: provision
        displayName: az deployment
        steps:
          - checkout: self
          - template: infra-bicep.yml
            parameters:
              serviceConnection: $(SERVICE_CONNECTION)
              azureEnvName: $(AZURE_ENV_NAME)
              resourceGroup: $(AZURE_RESOURCE_GROUP)
              location: $(AZURE_LOCATION)
              subscriptionId: $(AZURE_SUBSCRIPTION_ID)
              scope: resourceGroup
              templateFile: infra/main.bicep
              parametersFile: infra/main.parameters.json

  - template: azure-pipelines-post-deploy.yml
    parameters:
      serviceConnection: $(SERVICE_CONNECTION)
      resourceGroup: $(AZURE_RESOURCE_GROUP)
      azureEnvName: $(AZURE_ENV_NAME)
      subscriptionId: $(AZURE_SUBSCRIPTION_ID)
      dependsOn: Provision

  - stage: Cleanup
    displayName: Delete resource group
    dependsOn:
      - Provision
      - PostDeployTest
    condition: always()
    jobs:
      - job: cleanup
        displayName: az group delete
        steps:
          - task: AzureCLI@2
            displayName: Delete the resource group
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='$(AZURE_RESOURCE_GROUP)'
                if az group exists --name "$RG" | grep -qi true; then
                  echo "Deleting resource group: $RG"
                  az group delete --name "$RG" --yes
                  echo "Deleted: $RG"
                else
                  echo "Resource group $RG does not exist; nothing to delete."
                fi